<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Love Chat 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a0a1f;--panel:#2a1230;--panel2:#3d1c45;--line:rgba(255,182,213,.12);--rose:#ff5c93;--gold:#ffd9a8;--lav:#b79cff;
--mine:linear-gradient(135deg,#ff5c93,#d8479f);--theirs:#3a1b44;--text:#fff1f6;--muted:#c9a3b9;--danger:#ff4d6d;--ok:#3ddc97;--warn:#ffb454}
html{height:100%}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 20% 0%,#3b1346 0%,#1a0a1f 55%,#10050f 100%);color:var(--text);height:100%;overflow:hidden;font-size:14px}
button{font-family:inherit}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#hearts i{position:absolute;bottom:-40px;font-style:normal;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.login-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100vh;padding:16px}
.login-box{width:370px;max-width:100%;padding:34px 26px;border-radius:26px;text-align:center;background:linear-gradient(160deg,rgba(61,28,69,.85),rgba(42,18,48,.9));backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 24px 70px rgba(255,92,147,.18)}
.logo{font-size:54px;animation:beat 1.6s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 0 18px var(--rose))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.login-box h2{font-weight:800;font-size:22px;margin:6px 0 4px}
.login-box p{color:var(--muted);font-size:12px;margin-bottom:18px}
.login-box input{width:100%;padding:13px 15px;margin:6px 0;border-radius:14px;border:1px solid var(--line);background:rgba(16,5,15,.6);color:var(--text);font-family:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,92,147,.2)}
.go{width:100%;padding:13px;margin-top:12px;border:none;border-radius:14px;cursor:pointer;color:#fff;background:var(--mine);font-size:15px;font-weight:700;transition:.2s}
.go:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(255,92,147,.4)}
.langbtn{margin-top:14px;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px}
.error{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.info-msg{color:var(--ok);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.app{display:none;height:100vh;position:relative;z-index:1}.app.active{display:flex}
.sidebar{width:270px;background:rgba(42,18,48,.85);backdrop-filter:blur(12px);display:flex;flex-direction:column;border-inline-end:1px solid var(--line);transition:.25s}
.sidebar-header{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--lav));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;color:#fff}
.sidebar-header .info{flex:1;overflow:hidden}.sidebar-header .info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-header .info small{color:var(--gold);font-size:11px}
.users-title{padding:14px 16px 6px;color:var(--muted);font-size:12px;font-weight:700}
.users-list{flex:1;overflow-y:auto;padding:4px 8px}
.user-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;margin-bottom:2px}.user-item:hover{background:var(--panel2)}
.user-item .avatar{width:34px;height:34px;font-size:13px}.user-item .name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--danger);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:#6b4a60;flex-shrink:0}.dot.online{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sidebar-footer{padding:10px;border-top:1px solid var(--line)}
.sidebar-footer button{width:100%;padding:9px;border-radius:12px;background:var(--panel2);color:var(--text);border:none;cursor:pointer;font-size:13px;margin-bottom:6px}
.sidebar-footer button:hover{background:#52285c}.sidebar-footer .danger{background:rgba(255,77,109,.85)}
.chat{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
.chat-header{padding:12px 18px;background:rgba(42,18,48,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-header b{font-size:15px;font-weight:800}.chat-header .sub{color:var(--muted);font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none;background:var(--panel2);border:none;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.typing{height:20px;padding:0 20px;font-size:12px;color:var(--gold)}
.day{align-self:center;background:rgba(255,182,213,.1);color:var(--gold);font-size:11px;padding:3px 12px;border-radius:12px;margin:8px 0}
.msg{max-width:68%;padding:8px 13px 5px;border-radius:20px;font-size:14px;line-height:1.7;word-wrap:break-word;animation:pop .22s ease;transition:box-shadow .4s}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
.msg.mine{background:var(--mine);align-self:flex-start;border-bottom-right-radius:5px;box-shadow:0 6px 18px rgba(255,92,147,.22)}
.msg.theirs{background:var(--theirs);align-self:flex-end;border-bottom-left-radius:5px;border:1px solid var(--line)}
[dir=ltr] .msg.mine{align-self:flex-end}[dir=ltr] .msg.theirs{align-self:flex-start}
.msg.flash{box-shadow:0 0 0 3px var(--gold)}
.who{display:block;font-size:11px;color:var(--gold);font-weight:700}.msg.mine .who{display:none}
.meta{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:10px;opacity:.8;margin-top:2px;direction:ltr}
.meta .more{background:none;border:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 3px;opacity:.7}.meta .more:hover{opacity:1}
.ed{direction:inherit;cursor:default}
.quote{border-inline-start:3px solid var(--gold);background:rgba(0,0,0,.2);padding:3px 8px;border-radius:8px;margin-bottom:4px;font-size:12px;cursor:pointer;opacity:.9}
.quote b{display:block;color:var(--gold);font-size:11px}
.msg img.pic{display:block;max-width:100%;max-height:300px;border-radius:14px;margin:2px 0 4px;cursor:zoom-in}
.msg.big{background:transparent;border:none;box-shadow:none;padding:2px 6px}
.msg.big .st{font-size:64px;line-height:1.15;display:block;animation:wiggle .7s ease}.msg.big .meta{color:var(--muted)}
@keyframes wiggle{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
.msg.txt{background:linear-gradient(135deg,#ff5c93,#b79cff);border:none;padding:10px 18px 5px;text-align:center;font-weight:800;font-size:17px}
.msg.del{background:rgba(255,255,255,.05);border:1px dashed var(--line);box-shadow:none;color:var(--muted);font-style:italic}
.tick{font-weight:700;letter-spacing:-4px;margin-inline-end:4px;font-size:12px}.tick.read{color:#7df3ff}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx{background:rgba(0,0,0,.25);border:1px solid transparent;color:var(--text);border-radius:12px;padding:1px 8px;font-size:12px;cursor:pointer}.rx.me{border-color:var(--gold);background:rgba(255,217,168,.18)}
#ctx{display:none;position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:6px;min-width:170px;animation:pop .15s ease}
#ctx .qr{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
#ctx .qr span{font-size:22px;cursor:pointer;padding:2px 4px;border-radius:10px}#ctx .qr span:hover{background:var(--panel2);transform:scale(1.2)}
#ctx button{display:block;width:100%;text-align:start;background:none;border:none;color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}#ctx button:hover{background:var(--panel2)}#ctx button.red{color:var(--danger)}
.bar{display:none;align-items:center;gap:10px;padding:8px 16px;background:rgba(42,18,48,.92);border-top:1px solid var(--line);font-size:12px}
.bar.on{display:flex}.bar .txt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-inline-start:3px solid var(--rose);padding-inline-start:8px}.bar button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
.input-row{display:flex;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;align-items:center;background:rgba(42,18,48,.85);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.round-btn{width:42px;height:42px;border-radius:50%;background:var(--panel2);border:none;cursor:pointer;font-size:20px;transition:.2s;flex-shrink:0}.round-btn:hover,.round-btn.on{background:var(--rose);transform:scale(1.08)}
.input-row input[type=text]{flex:1;min-width:0;padding:12px 16px;border-radius:26px;border:1px solid var(--line);background:rgba(16,5,15,.6);color:var(--text);font-family:inherit;font-size:14px}
.send-btn{padding:0 20px;height:42px;border-radius:26px;background:var(--mine);color:#fff;border:none;cursor:pointer;font-weight:700;font-size:14px}
.picker{display:none;position:absolute;bottom:72px;inset-inline-start:12px;width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:10;overflow:hidden}.picker.open{display:block;animation:pop .18s ease}
.tabs{display:flex;background:rgba(0,0,0,.2)}.tabs button{flex:1;padding:9px 2px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:11.5px;font-weight:600}.tabs button.on{color:#fff;background:var(--panel2)}
.grid{display:grid;gap:6px;padding:12px;max-height:240px;overflow-y:auto}.grid.emo{grid-template-columns:repeat(7,1fr)}.grid.stk{grid-template-columns:repeat(4,1fr)}.grid.txt{grid-template-columns:repeat(2,1fr)}
.grid span{cursor:pointer;text-align:center;border-radius:12px;user-select:none}.grid span:hover{background:var(--panel2);transform:scale(1.1)}
.grid.emo span{font-size:25px;padding:3px}.grid.stk span{font-size:40px;padding:4px}.grid.txt span{font-size:12.5px;padding:10px 6px;background:rgba(255,92,147,.14);font-weight:600}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,2,12,.72);backdrop-filter:blur(5px);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}
.modal{width:100%;max-width:560px;background:var(--panel);border-radius:22px;padding:22px;max-height:88vh;overflow-y:auto;border:1px solid var(--line)}.modal h3{margin-bottom:14px;font-size:17px}
.modal input{width:100%;padding:10px 12px;margin:5px 0;border-radius:12px;border:1px solid var(--line);background:rgba(16,5,15,.6);color:var(--text);font-family:inherit;font-size:13px}
.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;padding:10px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px}
.btn-primary{background:var(--mine);color:#fff}.btn-secondary{background:var(--panel2);color:var(--text)}
.row{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(16,5,15,.5);border-radius:14px;margin-bottom:8px;flex-wrap:wrap}
.row .info{flex:1;min-width:140px}.row .info b{display:block;font-size:13px}.row .info small{color:var(--muted);font-size:11px;display:block}
.row button,.request-item button{padding:6px 10px;font-size:11px;border-radius:9px;border:none;cursor:pointer;color:#fff}
.mini-danger{background:var(--danger)}.mini-warn{background:var(--warn);color:#2a1230!important}
.log{display:block;font-size:12px;line-height:1.7}.log .h{color:var(--gold);font-weight:700}.log .old{color:#ff9db5;white-space:pre-wrap}.log .new{color:#9df0c8;white-space:pre-wrap}.log img{max-height:80px;border-radius:8px;display:block;margin-top:4px}
.request-box{background:rgba(255,180,84,.1);border:1px solid var(--warn);padding:10px;border-radius:14px;margin-top:10px;font-size:12px}
.request-item{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;align-items:center;justify-content:center;cursor:zoom-out}#lightbox.open{display:flex}#lightbox img{max-width:94vw;max-height:94vh;border-radius:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;padding:10px 20px;border-radius:14px;font-size:13px;z-index:400;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
#welPop{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(10,2,12,.78);backdrop-filter:blur(6px);padding:16px;cursor:pointer}#welPop.open{display:flex}
.wcard{position:relative;width:min(420px,100%);min-height:320px;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#6b1f55,#3d1c45) center/cover no-repeat;display:flex;align-items:flex-end;box-shadow:0 30px 90px rgba(255,92,147,.35);animation:pop .35s ease}
.wcard::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(16,5,15,.9),rgba(16,5,15,.1) 75%)}
.wcard p{position:relative;padding:26px 22px 34px;font-size:20px;font-weight:800;line-height:1.9;text-align:center;width:100%;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.wbar{position:absolute;bottom:0;inset-inline:0;height:5px;background:rgba(255,255,255,.15)}.wbar i{display:block;height:100%;background:var(--mine);animation:wshrink 5s linear forwards}@keyframes wshrink{from{width:100%}to{width:0}}
.wimg{width:100%;height:150px;border-radius:14px;background:var(--panel2) center/cover;margin:8px 0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:6px}
@media(max-width:700px){
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:78%;max-width:280px;z-index:50;transform:translateX(100%)}[dir=ltr] .sidebar{transform:translateX(-100%)}
.sidebar.open,[dir=ltr] .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}#menuBtn{display:block}.msg{max-width:86%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="hearts"></div>

<div class="login-wrap" id="loginWrap"><div class="login-box">
  <div class="logo">💖</div>
  <h2 data-i18n="welcome"></h2><p data-i18n="welcomeSub"></p>
  <input type="email" id="email" data-ph="email" autocomplete="username" />
  <input type="password" id="password" data-ph="password" autocomplete="current-password" />
  <button class="go" onclick="login()" data-i18n="login"></button>
  <div class="error" id="loginError"></div>
  <button class="langbtn" onclick="toggleLang()" data-i18n="langBtn"></button>
</div></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="avatar" id="myAvatar">?</div>
      <div class="info"><b id="myEmail"></b><small id="myStatus"></small></div></div>
    <div class="users-title" data-i18n="users"></div>
    <div class="users-list" id="usersList"></div>
    <div class="sidebar-footer">
      <button id="adminBtn" style="display:none" onclick="openAdmin()" data-i18n="manage"></button>
      <button id="logsBtn" style="display:none" onclick="openLogs()" data-i18n="logs"></button>
      <button id="welBtn" style="display:none" onclick="openWelAdmin()" data-i18n="welcomeAdmin"></button>
      <button onclick="toggleLang()" data-i18n="langBtn"></button>
      <button class="danger" onclick="logout()" data-i18n="logout"></button>
    </div>
  </aside>
  <main class="chat">
    <div class="chat-header">
      <button id="menuBtn" onclick="$('sidebar').classList.toggle('open')">👥</button>
      <b data-i18n="chatTitle"></b><span class="sub" id="headerLastSeen"></span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing"></div>
    <div class="picker" id="picker"><div class="tabs" id="tabs"></div><div class="grid" id="pickerGrid"></div></div>
    <div class="bar" id="bar"><span class="txt" id="barTxt"></span><button onclick="cancelBar()">✕</button></div>
    <form class="input-row" onsubmit="sendMessage(event)">
      <button type="button" class="round-btn" id="pickBtn" onclick="togglePicker()">😍</button>
      <button type="button" class="round-btn" onclick="$('file').click()">📷</button>
      <input type="file" id="file" accept="image/*" hidden />
      <input type="text" id="newMessage" data-ph="placeholder" autocomplete="off" />
      <button type="submit" class="send-btn" id="sendBtn"></button>
    </form>
  </main>
</div>

<div id="ctx"></div>
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" alt=""></div>

<div class="modal-bg" id="logsModal"><div class="modal">
  <h3 data-i18n="logsTitle"></h3><div id="logsList"></div>
  <div class="modal-actions"><button class="btn-secondary" onclick="$('logsModal').classList.remove('open')" data-i18n="close"></button></div>
</div></div>

<div class="modal-bg" id="adminModal"><div class="modal">
  <h3 data-i18n="manage"></h3><div id="adminUsersList"></div>
  <hr style="border-color:var(--line);margin:16px 0" />
  <h3 style="font-size:15px" data-i18n="addReq"></h3>
  <p style="font-size:12px;color:var(--muted);margin-bottom:8px" data-i18n="addReqNote"></p>
  <input id="newEmail" data-ph="email" /><input id="newPass" data-ph="newPass" />
  <div class="modal-actions"><button class="btn-primary" onclick="requestCreateUser()" data-i18n="submitReq"></button>
  <button class="btn-secondary" onclick="closeAdmin()" data-i18n="close"></button></div>
  <div class="error" id="adminError"></div><div class="info-msg" id="adminInfo"></div>
  <div class="request-box"><b data-i18n="pending"></b><div id="requestsList" style="margin-top:8px"></div></div>
</div></div>
<div id="welPop" onclick="closeWelcome()"><div class="wcard" id="welCard"><p id="welText"></p><div class="wbar" id="welBar"></div></div></div>
<div class="modal-bg" id="welModal"><div class="modal">
  <h3 data-i18n="welcomeAdmin"></h3>
  <p style="font-size:12px;color:var(--muted);margin-bottom:10px" data-i18n="welNote"></p>
  <div id="welList"></div>
  <input id="welInput" data-ph="welPh" />
  <div class="modal-actions"><button class="btn-primary" onclick="addWelcome()" data-i18n="add"></button></div>
  <hr style="border-color:var(--line);margin:16px 0" />
  <div class="wimg" id="welImg"></div>
  <input type="file" id="welFile" accept="image/*" hidden />
  <div class="modal-actions"><button class="btn-secondary" onclick="$('welFile').click()" data-i18n="welPickImg"></button><button class="btn-secondary" onclick="removeWelImg()" data-i18n="welRmImg"></button></div>
  <div class="modal-actions"><button class="btn-primary" onclick="showWelcome()" data-i18n="preview"></button><button class="btn-secondary" onclick="$('welModal').classList.remove('open')" data-i18n="close"></button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const db = supabase.createClient("https://kcqphtmuxzaqcqocxgtc.supabase.co","sb_publishable_aQmfb0-Eu0LnF2nIYx7rew_FwiQl_Wk");
const $ = id => document.getElementById(id);
const isAdmin = () => currentProfile?.role === 'admin';

/* ---------- زبان / Language ---------- */
const I18N = {
fa:{welcome:'خوش اومدی عزیزم',welcomeSub:'جایی برای دل‌نوشته‌های ما دو نفر',email:'ایمیل',password:'پسورد',login:'ورود 💌',langBtn:'🌐 English',

function buildTabs(){

function buildGrid(){

  else if(curTab==='text'){ g.className='grid txt'; PHRASES[lang].forEach(p=>add(p,()=>send(TPREFIX+p))); }
  else { g.className='grid stk'; PACKS[curTab].forEach(e=>add(e,()=>send(PREFIX+e))); }
}
function togglePicker(f){ const p=$('picker'), o=f===undefined?!p.classList.contains('open'):f; p.classList.toggle('open',o); $('pickBtn').classList.toggle('on',o); }
function spawnHearts(){

  for(let i=0;i<14;i++){const h=document.createElement('i'); h.textContent=set[i%6]; h.style.left=Math.random()*100+'%'; h.style.fontSize=(14+Math.random()*18)+'px'; h.style.animationDuration=(12+Math.random()*14)+'s'; h.style.animationDelay=(-Math.random()*20)+'s'; box.appendChild(h);}

/* ---------- وضعیت ---------- */
let currentUser=null,currentProfile=null,profilesMap={},profTimer=null,unread=0;
let msgs={},order=[],els={},lastDay='',replyTo=null,editing=null;
let logs=[],logsByMsg={},typingCh=null,typingTimers={},lastTypingSent=0;

window.addEventListener('DOMContentLoaded',async()=>{
  applyLang(); spawnHearts(); buildTabs(); buildGrid();
  $('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  $('file').addEventListener('change',e=>{const f=e.target.files[0]; e.target.value=''; if(f) sendImage(f);});
  $('newMessage').addEventListener('input',sendTyping);
  document.addEventListener('click',e=>{ if(!e.target.closest('#ctx,.more')) $('ctx').style.display='none'; });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){unread=0;document.title='Love Chat 💕';updateLastSeen();markRead();} });
  const {data:{session}}=await db.auth.getSession(); if(session) startApp(session.user);
});
function toast(m){const e=$('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200);}
async function login(){
  const email=$('email').value.trim(), password=$('password').value; $('loginError').textContent='';
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){$('loginError').textContent=t('err')+error.message;return;} startApp(data.user);
}
async function logout(){
  await updateLastSeen(); await db.removeAllChannels(); await db.auth.signOut(); location.reload();
}
async function startApp(user){
  currentUser=user; $('loginWrap').style.display='none'; $('app').classList.add('active');
  $('myEmail').textContent=user.email; $('myAvatar').textContent=(user.email[0]||'?').toUpperCase();
  const {data:prof}=await db.from('profiles').select('*').eq('id',user.id).single(); currentProfile=prof;
  if(isAdmin()){ $('adminBtn').style.display='block'; $('logsBtn').style.display='block'; $('welBtn').style.display='block'; await loadLogs(); }
  loadWelcome().then(()=>showWelcome()); applyLang(); await loadProfiles(); await loadMessages(); subscribeRealtime(); markRead(); startPresenceTimer();
}
async function updateLastSeen(){ if(currentUser) await db.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',currentUser.id); }
function startPresenceTimer(){
  updateLastSeen(); setInterval(updateLastSeen,30000); window.addEventListener('beforeunload',updateLastSeen);
  setInterval(()=>renderUsersList(Object.values(profilesMap)),30000);
}
async function loadProfiles(){
  const {data}=await db.from('profiles').select('*').order('created_at');
  profilesMap={}; (data||[]).forEach(p=>profilesMap[p.id]=p); renderUsersList(data||[]); updateHeaderLastSeen();
}
function renderUsersList(list){
  const box=$('usersList'); box.innerHTML='';
  list.forEach(p=>{
    const d=document.createElement('div'); d.className='user-item';
    const on=p.last_seen&&(Date.now()-new Date(p.last_seen).getTime()<60000);
    d.innerHTML=`<div class="avatar">${esc((p.display_name||p.email||'?')[0].toUpperCase())}</div><div class="name">${esc(p.display_name||p.email)}</div>${p.role==='admin'?`<span class="badge">${lang==='fa'?'ادمین':'admin'}</span>`:''}<div class="dot ${on?'online':''}"></div>`;
    box.appendChild(d);
  });
}
function updateHeaderLastSeen(){
  const e=$('headerLastSeen'); if(!isAdmin()){e.textContent='';return;}
  e.textContent=Object.values(profilesMap).filter(p=>p.id!==currentUser.id).map(p=>`${p.email}: ${p.last_seen?new Date(p.last_seen).toLocaleString(loc()):t('unknown')}`).join(' | ');
}

/* ---------- پیام‌ها ---------- */
async function loadMessages(){
  const {data}=await db.from('messages').select('*').order('created_at');
  msgs={};order=[]; (data||[]).forEach(m=>{msgs[m.id]=m;order.push(m.id);}); rerenderAll(true);
}
function rerenderAll(instant){
  const box=$('messages'); box.innerHTML=''; lastDay=''; els={};
  order.forEach(id=>appendMsg(msgs[id])); scrollBottom(instant);
}
function subscribeRealtime(){
  db.channel('messages-rt')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
      const m=p.new; msgs[m.id]=m; if(!order.includes(m.id)) order.push(m.id);
      const near=nearBottom(); appendMsg(m); if(near||m.user_id===currentUser.id) scrollBottom();
      if(document.hidden&&m.user_id!==currentUser.id){unread++;document.title=`(${unread}) Love Chat 💕`;}
      clearTyping(m.user_id); markRead();})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{ msgs[p.new.id]=p.new; refreshMsg(p.new.id); })
   .subscribe();
  db.channel('profiles-rt').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>{clearTimeout(profTimer);profTimer=setTimeout(loadProfiles,800);}).subscribe();
  if(isAdmin()) db.channel('logs-rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'message_logs'},p=>{
      addLog(p.new); refreshMsg(p.new.message_id); if($('logsModal').classList.contains('open')) renderLogs(); }).subscribe();
  typingCh=db.channel('typing').on('broadcast',{event:'typing'},({payload})=>{
      if(payload.uid===currentUser.id) return; typingTimers[payload.uid]=Date.now()+3000; renderTyping(payload.uid,payload.name);
      setTimeout(()=>renderTyping(),3100);}).subscribe();
}
const typingNames={};
function renderTyping(uid,name){ if(uid) typingNames[uid]=name;
  const names=Object.keys(typingTimers).filter(u=>typingTimers[u]>Date.now()).map(u=>typingNames[u]);
  $('typing').textContent=names.length?t('typing',names.join(', ')):''; }
function clearTyping(uid){ delete typingTimers[uid]; renderTyping(); }
function sendTyping(){
  if(!typingCh||Date.now()-lastTypingSent<2000) return; lastTypingSent=Date.now();
  typingCh.send({type:'broadcast',event:'typing',payload:{uid:currentUser.id,name:myName()}});
}
const myName=()=>currentProfile?.display_name||currentUser.email;
const nearBottom=()=>{const c=$('messages');return c.scrollHeight-c.scrollTop-c.clientHeight<160;};
function scrollBottom(instant){const c=$('messages'); c.style.scrollBehavior=instant?'auto':'smooth'; c.scrollTop=c.scrollHeight;}

function appendMsg(m){
  const box=$('messages'), d=new Date(m.created_at||Date.now()), key=d.toDateString();
  if(key!==lastDay){lastDay=key; const s=document.createElement('div'); s.className='day'; s.textContent=d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'}); box.appendChild(s);}
  const el=buildMsg(m); els[m.id]=el; box.appendChild(el);
}
function refreshMsg(id){ const m=msgs[id]; if(!m||!els[id]) return; const n=buildMsg(m); n.style.animation='none'; els[id].replaceWith(n); els[id]=n; }
const histTitle=id=>(logsByMsg[id]||[]).map(l=>(l.action==='edit'?'✏️ ':'🗑️ ')+(l.old_content||t('photo'))).join('\n');

function buildMsg(m){
  const mine=m.user_id===currentUser.id, div=document.createElement('div');
  const time=new Date(m.created_at).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
  const sender=profilesMap[m.user_id]?.display_name||m.username||''; const c=String(m.content||'');
  let cls='', body='', extra='';
  if(m.deleted_at){
    cls=' del'; body=`🚫 ${t('deleted')}`; if(isAdmin()&&logsByMsg[m.id]) div.title=histTitle(m.id);
  } else {
    if(m.reply_to) body+=`<div class="quote" data-q="${esc(m.reply_to)}">${esc(m.reply_preview||'')}</div>`;
    if(m.image_url) body+=`<img class="pic" src="${esc(m.image_url)}" alt="" loading="lazy">`;
    if(c.startsWith(PREFIX)&&!m.reply_to){cls=' big'; body+=`<span class="st">${esc(c.slice(PREFIX.length))}</span>`;}
    else if(c.startsWith(TPREFIX)){cls=' txt'; body+=esc(c.slice(TPREFIX.length));}
    else if(!m.image_url&&!m.reply_to&&/^[\p{Extended_Pictographic}\u200d\ufe0f\s]+$/u.test(c)&&[...c].length<=6){cls=' big'; body+=`<span class="st">${esc(c)}</span>`;}
    else if(c) body+=esc(c);
    const rx=Object.entries(m.reactions||{});
    if(rx.length) extra=`<div class="rxs">${rx.map(([e,a])=>`<button class="rx ${a.includes(currentUser.id)?'me':''}" data-e="${esc(e)}">${esc(e)} ${a.length}</button>`).join('')}</div>`;
  }
  const ed=m.edited_at&&!m.deleted_at?`<span class="ed" ${isAdmin()&&logsByMsg[m.id]?`title="${esc(histTitle(m.id))}"`:''}>✏️ ${t('edited')}</span>`:'';
  const more=m.deleted_at&&!isAdmin()?'':`<button class="more" type="button">⋯</button>`;
  div.className='msg '+(mine?'mine':'theirs')+cls; div.dataset.id=m.id;
  div.innerHTML=`${mine?'':`<span class="who">${esc(sender)}</span>`}${body}${extra}<div class="meta">${more}${ed}<span>${time}</span>${mine&&!m.deleted_at?tickHtml(m):''}</div>`;
  const mb=div.querySelector('.more'); if(mb) mb.onclick=e=>{e.stopPropagation(); openMenu(m,mb);};
  div.querySelectorAll('.rx').forEach(b=>b.onclick=()=>react(m.id,b.dataset.e));
  const q=div.querySelector('.quote'); if(q) q.onclick=()=>{const t=els[q.dataset.q]; if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1200);}};
  const im=div.querySelector('img.pic'); if(im) im.onclick=()=>{$('lbImg').src=im.src;$('lightbox').classList.add('open');};
  if(!m.deleted_at) div.ondblclick=()=>react(m.id,'❤️');
  return div;
}
function tickHtml(m){
  const others=Object.keys(profilesMap).filter(id=>id!==currentUser.id);
  const rb=(m.read_by||[]).filter(id=>id!==currentUser.id);
  if(!rb.length) return `<span class="tick" title="${t('sent')}">✓</span>`;
  const all=others.every(id=>rb.includes(id));
  const names=rb.map(id=>profilesMap[id]?.display_name||profilesMap[id]?.email||'').join(', ');
  return `<span class="tick ${all?'read':''}" title="${t('readBy')} ${esc(names)}">✓✓</span>`;
}
let readTimer=null;
function markRead(){
  clearTimeout(readTimer);
  readTimer=setTimeout(async()=>{
    if(document.hidden||!currentUser) return;
    const need=order.some(id=>{const m=msgs[id];return m&&m.user_id!==currentUser.id&&!m.deleted_at&&!(m.read_by||[]).includes(currentUser.id);});
    if(!need) return;
    const {error}=await db.rpc('mark_messages_read'); if(error) console.warn(error.message);
  },400);
}
const previewOf=m=>m.deleted_at?'':(m.image_url&&!m.content?t('photo'):String(m.content||'').replace(PREFIX,'').replace(TPREFIX,'')).slice(0,60);

/* منوی پیام */
function openMenu(m,btn){
  const ctx=$('ctx'), mine=m.user_id===currentUser.id; ctx.innerHTML='';
  if(!m.deleted_at){
    const qr=document.createElement('div'); qr.className='qr';
    QUICK.forEach(e=>{const s=document.createElement('span'); s.textContent=e; s.onclick=()=>{react(m.id,e);ctx.style.display='none';}; qr.appendChild(s);}); ctx.appendChild(qr);
    const item=(label,fn,red)=>{const b=document.createElement('button'); b.textContent=label; if(red) b.className='red'; b.onclick=()=>{ctx.style.display='none';fn();}; ctx.appendChild(b);};
    item(t('reply'),()=>{replyTo={id:m.id,name:profilesMap[m.user_id]?.display_name||m.username,preview:previewOf(m)};editing=null;setBar();$('newMessage').focus();});
    if(m.content&&!m.content.startsWith(PREFIX)) item(t('copy'),()=>{navigator.clipboard?.writeText(m.content.replace(TPREFIX,''));toast(t('copied'));});
    const plain=!String(m.content||'').startsWith(PREFIX)&&!String(m.content||'').startsWith(TPREFIX);
    if(mine&&plain) item(t('edit'),()=>{editing=m;replyTo=null;$('newMessage').value=m.content||'';setBar();$('newMessage').focus();});
    if(mine||isAdmin()) item(t('del'),()=>deleteMsg(m),true);
  } else { const d=document.createElement('button'); d.textContent=histTitle(m.id)||'—'; d.style.whiteSpace='pre-wrap'; ctx.appendChild(d); }
  ctx.style.display='block'; const r=btn.getBoundingClientRect(), w=ctx.offsetWidth, h=ctx.offsetHeight;
  ctx.style.left=Math.min(Math.max(8,r.left-w/2),innerWidth-w-8)+'px';
  ctx.style.top=(r.bottom+h+8>innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+'px';
}
function setBar(){
  const bar=$('bar'); $('sendBtn').textContent=editing?t('save'):t('send');
  if(editing){bar.classList.add('on');$('barTxt').textContent='✏️ '+t('editing')+': '+previewOf(editing);}
  else if(replyTo){bar.classList.add('on');$('barTxt').textContent='↩️ '+t('replying')+' '+(replyTo.name||'')+': '+replyTo.preview;}
  else bar.classList.remove('on');
}
function cancelBar(){ if(editing) $('newMessage').value=''; editing=null; replyTo=null; setBar(); }

/* ارسال / ویرایش / حذف / واکنش */
async function send(content,extra={}){
  togglePicker(false);
  const row={user_id:currentUser.id,username:myName(),content,...extra};
  if(replyTo){row.reply_to=String(replyTo.id);row.reply_preview=replyTo.preview;}
  const {error}=await db.from('messages').insert(row);
  if(error){toast(t('err')+error.message);return false;} replyTo=null; setBar(); return true;
}
async function sendMessage(e){
  e.preventDefault(); const input=$('newMessage'), text=input.value.trim();
  if(editing){
    const m=editing; if(!text||text===m.content){cancelBar();return;}
    const {error}=await db.from('messages').update({content:text}).eq('id',m.id);
    if(error) toast(t('err')+error.message); input.value=''; editing=null; setBar(); return;
  }
  if(!text) return; input.value=''; await send(text);
}
async function deleteMsg(m){
  if(!confirm(t('confirmDel'))) return;
  const {error}=await db.from('messages').update({deleted_at:new Date().toISOString(),content:'',image_url:null,reactions:{}}).eq('id',m.id);
  if(error) toast(t('err')+error.message);
}
async function react(id,emoji){
  const {error}=await db.rpc('toggle_reaction',{p_msg:String(id),p_emoji:emoji}); if(error) toast(t('err')+error.message);
}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file), s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.82));
  }catch(e){ return file; }
}
async function sendImage(file){
  toast(t('uploading')); const blob=await shrink(file);
  const path=`${currentUser.id}/${Date.now()}.jpg`;
  const {error}=await db.storage.from('chat-images').upload(path,blob,{contentType:blob.type||'image/jpeg'});
  if(error){toast(t('err')+error.message);return;}
  const url=db.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
  const input=$('newMessage'), cap=input.value.trim(); input.value='';
  await send(cap,{image_url:url});
}

/* ---------- لاگ ادمین ---------- */
function addLog(l){ logs.push(l); (logsByMsg[l.message_id]=logsByMsg[l.message_id]||[]).push(l); }
async function loadLogs(){
  const {data}=await db.from('message_logs').select('*').order('created_at'); logs=[]; logsByMsg={}; (data||[]).forEach(addLog);
}
function openLogs(){ renderLogs(); $('logsModal').classList.add('open'); }
function renderLogs(){
  const box=$('logsList'); if(!logs.length){box.innerHTML=`<div style="color:var(--muted)">${t('noLogs')}</div>`;return;}
  box.innerHTML=[...logs].reverse().map(l=>{
    const owner=profilesMap[l.user_id]?.email||l.username||'?', actor=profilesMap[l.actor_id]?.email||'?';
    return `<div class="row"><span class="log"><span class="h">${l.action==='edit'?t('actEdit'):t('actDel')} — ${esc(owner)}${l.actor_id!==l.user_id?` (${t('by')} ${esc(actor)})`:''}</span>
      <small style="color:var(--muted)">${new Date(l.created_at).toLocaleString(loc())}</small>
      <span class="old">${t('before')} ${esc(l.old_content||'')}</span>${l.new_content!=null?`<span class="new">${t('after')} ${esc(l.new_content)}</span>`:''}
      ${l.image_url?`<img src="${esc(l.image_url)}" alt="">`:''}</span></div>`;}).join('');
}

/* ---------- پاپ‌آپ خوش‌آمد ---------- */
const WEL_MS=5000, AWAY_MS=5*60*1000; let welcome={all:[],image:null}, welTimer=null, hiddenAt=0;
async function loadWelcome(){
  const [a,b]=await Promise.all([db.from('welcome_messages').select('*').order('created_at'),db.from('app_settings').select('*').eq('key','welcome_image').maybeSingle()]);
  welcome.all=a.data||[]; welcome.image=b.data?.value||null;
}
function showWelcome(){
  const list=welcome.all.filter(w=>w.active); if(!list.length) return;
  const w=list[Math.floor(Math.random()*list.length)];
  $('welCard').style.backgroundImage=welcome.image?`url("${welcome.image.replace(/"/g,'%22')}")`:'';
  $('welText').textContent=w.text;
  $('welBar').innerHTML='<i></i>'; $('welPop').classList.add('open');
  clearTimeout(welTimer); welTimer=setTimeout(closeWelcome,WEL_MS);
}
function closeWelcome(){ clearTimeout(welTimer); $('welPop').classList.remove('open'); }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(currentUser&&hiddenAt&&Date.now()-hiddenAt>AWAY_MS){ hiddenAt=0; loadWelcome().then(showWelcome); }
});
async function openWelAdmin(){ await loadWelcome(); renderWelAdmin(); $('welModal').classList.add('open'); }
function renderWelAdmin(){
  const box=$('welList'); box.innerHTML='';
  if(!welcome.all.length) box.innerHTML=`<div style="color:var(--muted);margin-bottom:8px">${t('welEmpty')}</div>`;
  welcome.all.forEach(w=>{
    const r=document.createElement('div'); r.className='row'; r.style.opacity=w.active?1:.5;
    r.innerHTML=`<div class="info"><b>${esc(w.text)}</b></div><button class="mini-warn">${w.active?t('welOn'):t('welOff')}</button><button class="mini-danger">🗑️</button>`;
    const [a,b]=r.querySelectorAll('button');
    a.onclick=async()=>{await db.from('welcome_messages').update({active:!w.active}).eq('id',w.id); await loadWelcome(); renderWelAdmin();};
    b.onclick=async()=>{await db.from('welcome_messages').delete().eq('id',w.id); await loadWelcome(); renderWelAdmin();};
    box.appendChild(r);
  });
  $('welImg').style.backgroundImage=welcome.image?`url("${welcome.image.replace(/"/g,'%22')}")`:'';
}
async function addWelcome(){
  const v=$('welInput').value.trim(); if(!v) return;
  const {error}=await db.from('welcome_messages').insert({text:v});
  if(error){toast(t('err')+error.message);return;} $('welInput').value=''; await loadWelcome(); renderWelAdmin();
}
$('welFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return; toast(t('uploading'));
  const blob=await shrink(f), path=`welcome/${Date.now()}.jpg`;
  const up=await db.storage.from('chat-images').upload(path,blob,{contentType:blob.type||'image/jpeg'});
  if(up.error){toast(t('err')+up.error.message);return;}
  const url=db.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
  const {error}=await db.from('app_settings').upsert({key:'welcome_image',value:url});
  if(error){toast(t('err')+error.message);return;} await loadWelcome(); renderWelAdmin();
});
async function removeWelImg(){ await db.from('app_settings').delete().eq('key','welcome_image'); await loadWelcome(); renderWelAdmin(); }

/* ---------- ادمین ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function openAdmin(){$('adminModal').classList.add('open');loadAdminUsers();loadRequests();}
function closeAdmin(){$('adminModal').classList.remove('open');$('adminError').textContent='';$('adminInfo').textContent='';}
async function loadAdminUsers(){
  const box=$('adminUsersList'); box.textContent=t('loading');
  const {data,error}=await db.from('profiles').select('*').order('created_at');
  if(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`;return;} box.innerHTML='';
  (data||[]).forEach(u=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div class="info"><b>${esc(u.email)}</b><small>${t('lastSeen')} ${u.last_seen?new Date(u.last_seen).toLocaleString(loc()):t('never')}</small>${u.role==='admin'?'<small style="color:var(--danger)">🛡️</small>':''}</div><button class="mini-warn">${u.role==='admin'?t('rmAdmin'):t('mkAdmin')}</button><button class="mini-danger">${t('rmList')}</button>`;
    const [a,b]=row.querySelectorAll('button'); a.onclick=()=>toggleRole(u.id,u.role); b.onclick=()=>removeProfile(u.id,u.email); box.appendChild(row);
  });
}
async function removeProfile(id,email){
  if(!confirm(t('rmConfirm',email))) return;
  const {error}=await db.from('profiles').delete().eq('id',id); if(error){alert(error.message);return;}
  await loadAdminUsers(); await loadProfiles();
}
async function toggleRole(id,role){
  const {error}=await db.from('profiles').update({role:role==='admin'?'user':'admin'}).eq('id',id); if(error){alert(error.message);return;}
  await loadAdminUsers(); await loadProfiles();
}
async function requestCreateUser(){
  const email=$('newEmail').value.trim(), password=$('newPass').value, err=$('adminError'), info=$('adminInfo'); err.textContent='';info.textContent='';
  if(!email||!password){err.textContent=t('reqNeed');return;}
  const {error}=await db.from('user_requests').insert({requested_by:currentUser.id,action:'create',target_email:email,new_password:password});
  if(error){err.textContent=error.message;return;} info.textContent=t('reqOk'); $('newEmail').value='';$('newPass').value=''; loadRequests();
}
async function loadRequests(){
  const box=$('requestsList'); const {data}=await db.from('user_requests').select('*').eq('status','pending').order('created_at',{ascending:false});
  if(!data||!data.length){box.innerHTML=`<div style="color:var(--muted)">${t('none')}</div>`;return;} box.innerHTML='';
  data.forEach(r=>{const d=document.createElement('div'); d.className='request-item';
    d.innerHTML=`<span>${esc(r.target_email)} <small style="color:var(--muted)">(${esc(r.new_password||'-')})</small></span><button class="mini-danger">${t('done')}</button>`;
    d.querySelector('button').onclick=async()=>{await db.from('user_requests').update({status:'done'}).eq('id',r.id);loadRequests();}; box.appendChild(d);});
}
